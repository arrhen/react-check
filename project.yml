name: ReactCheck
options:
  bundleIdPrefix: me.arrhen
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: R9ACZFAZ2U
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  ReactCheckCore:
    path: .
targets:
  ReactCheck:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: ReactCheckCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.arrhen.ReactCheck
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: React Check
        INFOPLIST_KEY_NSCameraUsageDescription: React Check uses the camera to read food labels. Images are processed on this device and are never sent anywhere.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
